<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="boltShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Outer glowing accent circle -->
  <circle cx="256" cy="256" r="180" fill="#0b0f19" stroke="url(#glowRing)" stroke-width="8" stroke-dasharray="1130" opacity="0.9"/>
  <circle cx="256" cy="256" r="172" fill="#121826"/>

  <!-- Lightning Bolt Symbol -->
  <polygon points="280,100 170,260 250,260 220,412 350,230 270,230" 
           fill="url(#boltGrad)" 
           stroke="#ffffff" 
           stroke-width="3"
           filter="url(#boltShadow)"/>
</svg>
